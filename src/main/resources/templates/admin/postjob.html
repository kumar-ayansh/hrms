<html lang="en" th:replace="~{admin/adminbase::layout(~{::main})}">
<body>
	<main>
		<!-- Page Header -->
		<div class="page-header py-4">
			<div class="page-block">
				<div class="row align-items-center">
					<div class="col-md-12">
						<ul class="breadcrumb mb-2 text-muted small">
							<li class="breadcrumb-item"><a href="/admin/admindashboard">Dashboard</a></li>
							<li class="breadcrumb-item">Jobs</li>
							<li class="breadcrumb-item active fw-bold text-primary">Post Job</li>
						</ul>
						<div class="page-header-title">
							<h2 class="mb-0 text-dark fw-bold">Post Job Details</h2>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Form Container Card -->
		<div class="row px-3 justify-content-center">
			<div class="col-md-8 card border-0 shadow-sm rounded-3 p-4 bg-white">
				
				<!-- Success Alert Notification -->
				<div th:if="${msg}" class="alert alert-success alert-dismissible fade show border-0 bg-light-success text-success mb-4" role="alert">
					<i class="ti ti-circle-check me-2"></i>
					<span th:text="${msg}"></span>
				</div>

				<form method="post" th:object="${jdto}">
					<div class="row g-3">
						
						<!-- Job Title -->
						<div class="col-md-12">
							<label class="form-label fw-semibold text-secondary">Job Title</label>
							<input type="text" th:field="${jdto.title}" class="form-control" placeholder="e.g. Senior Java Developer" required>
						</div>

						<!-- Description -->
						<div class="col-md-12">
							<label class="form-label fw-semibold text-secondary">Description</label>
							<textarea th:field="${jdto.description}" class="form-control" rows="4" placeholder="Enter job responsibilities and requirements..." required></textarea>
						</div>

						<!-- Location -->
						<div class="col-md-6">
							<label class="form-label fw-semibold text-secondary">Location</label>
							<input type="text" th:field="${jdto.location}" class="form-control" placeholder="e.g. Lucknow, Remote" required>
						</div>

						<!-- Salary (FIXED) -->
						<div class="col-md-6">
							<label class="form-label fw-semibold text-secondary">Salary (Annual / Monthly)</label>
							<input type="text" th:field="${jdto.salary}" class="form-control" placeholder="e.g. ₹5,00,000 - ₹8,00,000" required>
						</div>

						<!-- Job Type -->
						<div class="col-md-6">
							<label class="form-label fw-semibold text-secondary">Job Type</label>
							<select class="form-select form-control" th:field="${jdto.jobtype}">
								<option value="fulltime">Full time</option>
								<option value="partime">Part time</option>
								<option value="internship">Internship</option>
							</select>
						</div>

						<!-- Last Date -->
						<div class="col-md-6">
							<label class="form-label fw-semibold text-secondary">Last Date to Apply</label>
							<input type="date" th:field="${jdto.lastdate}" class="form-control" required>
						</div>

						<!-- Submit Button -->
						<div class="col-md-12 text-end mt-4">
							<button type="submit" class="btn btn-primary px-4 py-2">
								<i class="ti ti-plus me-1"></i> Post Job
							</button>
						</div>

					</div>
				</form>
				
			</div>
		</div>
	</main>
</body>
</html>

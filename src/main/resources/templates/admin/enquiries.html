<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">

<body>
	<main>
		
		<h2 style="color: blue; text-align:center;">View Enquiries</h2>
		<hr />
		<table class="table table-bordered">

			<tr>

				<th>Id</th>
				<th>Name</th>
				<th>Address</th>
				<th>Contact No</th>
				<th> Email Address</th>
				<th> Enquiry text</th>
			</tr>
			<tr th:each="e :${enq}">
			<td th:text="${e.id}"></td>
			<td th:text="${e.name}"></td>
			<td th:text="${e.address}"></td>
			<td th:text="${e.contactno}"></td>
			<td th:text="${e.emailaddress}"></td>
			<td th:text="${e.enquirytext}"></td>
			</tr>

		</table>
	</main>

</body>

</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="light" th:replace="~{base::layout(~{::main})}" xmlns:th="http://thymeleaf.org">

<head>
    <title>Posted Jobs - HR Synergy</title>
</head>

<body>
<main>
    <!-- Header Section -->
    <section class="bg-soft-blue py-4 border-bottom border-blue-subtle">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-12">
                    <ul class="breadcrumb mb-2 text-muted small">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                        <li class="breadcrumb-item active fw-bold text-primary">Posted Jobs</li>
                    </ul>
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <div>
                            <h2 class="mb-1 text-navy fw-bold"><i class="fa-solid fa-briefcase text-primary me-2"></i>Posted Jobs</h2>
                            <p class="text-muted mb-0">Browse active job listings and explore career opportunities with HR Synergy.</p>
                        </div>
                        <div>
                            <a th:href="@{/registration}" class="btn btn-blue-primary px-4 py-2">
                                <i class="fa-solid fa-user-plus me-2"></i> Register to Apply
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Table Container -->
    <section class="py-5 bg-white">
        <div class="container">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th class="ps-4 text-uppercase fs-7 font-weight-bold">Id</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Title</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Description</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Location</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Salary</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Job Type</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Last Date</th>
                                    <th class="text-uppercase fs-7 font-weight-bold">Posted Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Loop through job listings -->
                                <tr th:each="j:${jinfo}">
                                    <td class="ps-4 fw-bold text-secondary" th:text="${j.id}"></td>
                                    <td>
                                        <span class="fw-semibold text-dark" th:text="${j.title}"></span>
                                    </td>
                                    <td class="text-wrap" style="max-width: 250px;" th:text="${j.description}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border py-1.5 px-2.5 rounded-pill" th:text="${j.location}"></span>
                                    </td>
                                    <td>
                                        <span class="fw-bold text-success" th:text="${j.salary}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary-light text-primary py-1.5 px-2.5 rounded" th:text="${j.jobtype}"></span>
                                    </td>
                                    <td class="text-muted" th:text="${j.lastdate}"></td>
                                    <td class="text-muted" th:text="${j.posteddate}"></td>
                                </tr>

                                <!-- Empty Database Condition Handling -->
                                <tr th:if="${#lists.isEmpty(jinfo)}">
                                    <td colspan="8" class="text-center py-5 text-muted bg-white">
                                        <div class="fs-3 mb-2"><i class="fa-solid fa-folder-open text-muted"></i></div>
                                        <h5 class="fw-semibold text-secondary">No Active Job Posts Found</h5>
                                        <p class="small text-muted mb-0">Check back later for new career opportunities.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
